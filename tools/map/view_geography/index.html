<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWWV Geography Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    #controls {
      padding: 12px 16px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    #controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }
    
    #controls input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    
    #legend {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #555;
    }
    
    #legend span {
      white-space: nowrap;
    }
    
    #warning {
      padding: 8px 16px;
      background: #fff3cd;
      border-bottom: 1px solid #ffc107;
      color: #856404;
      font-size: 13px;
      display: none;
    }
    
    #warning.show {
      display: block;
    }
    
    #error {
      padding: 20px;
      text-align: center;
      color: #d32f2f;
      display: none;
    }
    
    #error.show {
      display: block;
    }
    
    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #fafafa;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="warning" class=""></div>
  <div id="error" class=""></div>
  <div id="controls">
    <label>
      <input type="checkbox" id="showSettlements" checked>
      Show settlements borders
    </label>
    <label>
      <input type="checkbox" id="showMunicipalities" checked>
      Show municipalities borders
    </label>
    <label>
      <input type="checkbox" id="showUnknown">
      Show unknown borders
    </label>
    <div id="legend">
      <span id="legendSettlements">Settlements: 0</span>
      <span id="legendMunicipalities">Municipalities: 0</span>
      <span id="legendUnknown">Unknown: 0</span>
    </div>
  </div>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>
  <script src="/viewer.js"></script>
</body>
</html>
