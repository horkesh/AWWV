<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWWV Geography Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #0d1117;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #161b22 0%, #1c2128 100%);
            padding: 15px 20px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5);
            z-index: 1000;
            border-bottom: 2px solid #30363d;
        }
        
        #header h1 {
            color: #58a6ff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        #controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #21262d;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
        
        label {
            font-size: 13px;
            color: #8b949e;
            font-weight: 500;
        }
        
        input[type="file"] {
            font-size: 12px;
            padding: 6px 12px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e0e0e0;
            cursor: pointer;
        }
        
        input[type="file"]:hover {
            background: #30363d;
            border-color: #58a6ff;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #58a6ff;
        }
        
        select, input[type="text"] {
            padding: 6px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 12px;
            cursor: pointer;
        }
        
        select:hover, input[type="text"]:hover {
            border-color: #58a6ff;
        }
        
        button {
            padding: 8px 16px;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover { background: #2ea043; }
        
        button.secondary {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e0e0e0;
        }
        
        button.secondary:hover { background: #30363d; }
        
        #sidebar {
            position: fixed;
            top: 140px;
            left: 15px;
            width: 320px;
            background: rgba(22, 27, 34, 0.95);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid #30363d;
            max-height: calc(100vh - 160px);
            overflow-y: auto;
        }
        
        #sidebar h3 {
            margin-bottom: 15px;
            color: #58a6ff;
            font-size: 16px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 13px;
        }
        
        .stat-label { color: #8b949e; }
        .stat-value { color: #58a6ff; font-weight: 600; }
        
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #0d1117;
            border-radius: 6px;
            border: 1px solid #21262d;
        }
        
        .section h4 {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        #search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        .search-result {
            padding: 8px;
            margin: 4px 0;
            background: #21262d;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        
        .search-result:hover {
            background: #30363d;
            border-color: #58a6ff;
        }
        
        .search-result-title {
            color: #e0e0e0;
            font-weight: 600;
        }
        
        .search-result-info {
            color: #8b949e;
            font-size: 11px;
            margin-top: 2px;
        }
        
        #canvas-container {
            position: fixed;
            top: 140px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        #canvas {
            cursor: grab;
            background: #0d1117;
        }
        
        #canvas:active { cursor: grabbing; }
        
        #info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(22, 27, 34, 0.95);
            padding: 15px 20px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #30363d;
            min-width: 200px;
        }
        
        #info-panel .info-item {
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        
        #tooltip {
            position: fixed;
            background: rgba(22, 27, 34, 0.98);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            border: 1px solid #30363d;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-width: 300px;
        }
        
        #tooltip .tooltip-title {
            color: #58a6ff;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }
        
        #tooltip .tooltip-row {
            margin: 3px 0;
            color: #8b949e;
        }
        
        #tooltip .tooltip-value {
            color: #e0e0e0;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(22, 27, 34, 0.95);
            padding: 40px;
            border-radius: 8px;
            font-size: 16px;
            border: 1px solid #30363d;
            text-align: center;
            z-index: 3000;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .legend {
            position: fixed;
            bottom: 20px;
            left: 355px;
            background: rgba(22, 27, 34, 0.95);
            padding: 15px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #30363d;
        }
        
        .legend-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #58a6ff;
            font-size: 13px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
        }
        
        .legend-color {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }
        
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    </style>
</head>
<body>
    <div id="header">
        <h1>🗺️ AWWV Geography Viewer</h1>
        <div id="controls">
            <div class="control-group">
                <label>📁 Load:</label>
                <input type="file" id="geographyFile" accept=".geojson,.json">
            </div>
            
            <div class="control-group">
                <input type="checkbox" id="showSettlements" checked>
                <label for="showSettlements">Settlements</label>
            </div>
            
            <div class="control-group">
                <input type="checkbox" id="showMunicipalities" checked>
                <label for="showMunicipalities">Municipalities</label>
            </div>
            
            <div class="control-group">
                <input type="checkbox" id="fillMunicipalities">
                <label for="fillMunicipalities">Fill Borders</label>
            </div>
            
            <div class="control-group">
                <label>Color:</label>
                <select id="colorScheme">
                    <option value="default">Default</option>
                    <option value="size">By Size</option>
                    <option value="random">Random</option>
                </select>
            </div>
            
            <button id="resetView">Reset View</button>
            <button id="toggleSidebar" class="secondary">Toggle Info</button>
        </div>
    </div>
    
    <div id="sidebar">
        <h3>📊 Statistics</h3>
        
        <div class="section">
            <div class="stat-row">
                <span class="stat-label">Total Features:</span>
                <span class="stat-value" id="totalFeatures">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Settlements:</span>
                <span class="stat-value" id="settlementCount">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Municipalities:</span>
                <span class="stat-value" id="municipalityCount">0</span>
            </div>
        </div>
        
        <div class="section">
            <h4>🔍 Search Municipality</h4>
            <input type="text" id="searchInput" placeholder="Enter municipality ID..." style="width: 100%;">
            <div id="search-results"></div>
        </div>
        
        <div class="section">
            <h4>📈 Top Municipalities</h4>
            <div id="topMunicipalities"></div>
        </div>
    </div>
    
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    
    <div id="info-panel">
        <div class="info-item">
            <span style="color: #8b949e;">Zoom:</span>
            <span style="color: #58a6ff;" id="zoomLevel">1.0x</span>
        </div>
        <div class="info-item">
            <span style="color: #8b949e;">Position:</span>
            <span style="color: #58a6ff;" id="positionInfo">0, 0</span>
        </div>
        <div class="info-item">
            <span style="color: #8b949e;">Hover:</span>
            <span style="color: #58a6ff;" id="hoverInfo">-</span>
        </div>
    </div>
    
    <div class="legend">
        <div class="legend-title">Legend</div>
        <div class="legend-item">
            <div class="legend-color" style="background: #58a6ff;"></div>
            <span>Municipality Border</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #f85149;"></div>
            <span>Settlement</span>
        </div>
    </div>
    
    <div id="tooltip"></div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        
        let geographyData = null;
        let settlements = [];
        let municipalities = [];
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;
        let municipalityColors = new Map();
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 140;
            render();
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        document.getElementById('geographyFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerHTML = '<div class="loading-spinner"></div><div>Loading geography data...</div>';
            document.body.appendChild(loading);
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    geographyData = JSON.parse(event.target.result);
                    processGeography();
                    document.body.removeChild(loading);
                } catch (err) {
                    alert('Error loading file: ' + err.message);
                    document.body.removeChild(loading);
                }
            };
            reader.readAsText(file);
        });
        
        function processGeography() {
            settlements = geographyData.features.filter(f => f.properties.feature_type === 'settlement');
            municipalities = geographyData.features.filter(f => f.properties.feature_type === 'municipality');
            
            municipalities.forEach(m => {
                const hue = Math.random() * 360;
                municipalityColors.set(m.properties.mid, `hsl(${hue}, 70%, 60%)`);
            });
            
            document.getElementById('totalFeatures').textContent = geographyData.features.length.toLocaleString();
            document.getElementById('settlementCount').textContent = settlements.length.toLocaleString();
            document.getElementById('municipalityCount').textContent = municipalities.length.toLocaleString();
            
            updateTopMunicipalities();
            autoFit();
            render();
        }
        
        function updateTopMunicipalities() {
            const sorted = [...municipalities].sort((a, b) => b.properties.num_settlements - a.properties.num_settlements);
            
            const html = sorted.slice(0, 5).map((m, i) => `
                <div class="search-result" onclick="focusOnMunicipality('${m.properties.mid}')">
                    <div class="search-result-title">${i + 1}. Municipality ${m.properties.mid}</div>
                    <div class="search-result-info">${m.properties.num_settlements} settlements, ${m.properties.total_area_pixels.toFixed(0)} px²</div>
                </div>
            `).join('');
            
            document.getElementById('topMunicipalities').innerHTML = html;
        }
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (!query || !municipalities.length) {
                document.getElementById('search-results').innerHTML = '';
                return;
            }
            
            const results = municipalities.filter(m => m.properties.mid.toLowerCase().includes(query)).slice(0, 10);
            
            const html = results.map(m => `
                <div class="search-result" onclick="focusOnMunicipality('${m.properties.mid}')">
                    <div class="search-result-title">Municipality ${m.properties.mid}</div>
                    <div class="search-result-info">${m.properties.num_settlements} settlements, ${m.properties.total_area_pixels.toFixed(0)} px²</div>
                </div>
            `).join('');
            
            document.getElementById('search-results').innerHTML = html;
        });
        
        window.focusOnMunicipality = function(mid) {
            const municipality = municipalities.find(m => m.properties.mid === mid);
            if (!municipality) return;
            
            const bounds = getBoundingBox(municipality);
            const centerX = (bounds.minX + bounds.maxX) / 2;
            const centerY = (bounds.minY + bounds.maxY) / 2;
            
            const targetScale = Math.min(
                canvas.width / (bounds.maxX - bounds.minX) * 0.7,
                canvas.height / (bounds.maxY - bounds.minY) * 0.7
            );
            
            scale = targetScale;
            offsetX = canvas.width / 2 - centerX * scale;
            offsetY = canvas.height / 2 - centerY * scale;
            
            document.getElementById('zoomLevel').textContent = scale.toFixed(2) + 'x';
            render();
        };
        
        ['showSettlements', 'showMunicipalities', 'fillMunicipalities'].forEach(id => {
            document.getElementById(id).addEventListener('change', render);
        });
        
        document.getElementById('colorScheme').addEventListener('change', render);
        document.getElementById('resetView').addEventListener('click', () => { autoFit(); render(); });
        document.getElementById('toggleSidebar').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.style.display = sidebar.style.display === 'none' ? 'block' : 'none';
        });
        
        function getBoundingBox(feature) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            
            const processCoords = (coords) => {
                for (const item of coords) {
                    if (Array.isArray(item[0])) {
                        processCoords(item);
                    } else {
                        const [x, y] = item;
                        minX = Math.min(minX, x);
                        minY = Math.min(minY, y);
                        maxX = Math.max(maxX, x);
                        maxY = Math.max(maxY, y);
                    }
                }
            };
            
            processCoords(feature.geometry.coordinates);
            return { minX, minY, maxX, maxY };
        }
        
        function autoFit() {
            if (!geographyData) return;
            
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            
            geographyData.features.forEach(feature => {
                const bounds = getBoundingBox(feature);
                minX = Math.min(minX, bounds.minX);
                minY = Math.min(minY, bounds.minY);
                maxX = Math.max(maxX, bounds.maxX);
                maxY = Math.max(maxY, bounds.maxY);
            });
            
            const dataWidth = maxX - minX;
            const dataHeight = maxY - minY;
            
            const scaleX = (canvas.width * 0.85) / dataWidth;
            const scaleY = (canvas.height * 0.85) / dataHeight;
            
            scale = Math.min(scaleX, scaleY);
            offsetX = (canvas.width - dataWidth * scale) / 2 - minX * scale;
            offsetY = (canvas.height - dataHeight * scale) / 2 - minY * scale;
            
            document.getElementById('zoomLevel').textContent = scale.toFixed(2) + 'x';
        }
        
        function worldToScreen(x, y) {
            return [x * scale + offsetX, y * scale + offsetY];
        }
        
        function screenToWorld(x, y) {
            return [(x - offsetX) / scale, (y - offsetY) / scale];
        }
        
        function render() {
            if (!geographyData) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const showMunicipalities = document.getElementById('showMunicipalities').checked;
            const showSettlements = document.getElementById('showSettlements').checked;
            const fillMunicipalities = document.getElementById('fillMunicipalities').checked;
            const colorScheme = document.getElementById('colorScheme').value;
            
            if (showMunicipalities) {
                municipalities.forEach(municipality => {
                    let color = '#58a6ff';
                    
                    if (colorScheme === 'size') {
                        const size = municipality.properties.num_settlements;
                        color = size > 100 ? '#ff6b6b' : size > 50 ? '#f9ca24' : '#58a6ff';
                    } else if (colorScheme === 'random') {
                        color = municipalityColors.get(municipality.properties.mid);
                    }
                    
                    renderMultiPolygon(municipality.geometry, color, fillMunicipalities);
                });
            }
            
            if (showSettlements) {
                settlements.forEach(settlement => {
                    renderPolygon(settlement.geometry, '#f85149', false);
                });
            }
        }
        
        function renderMultiPolygon(geometry, color, fill) {
            if (geometry.type === 'Polygon') {
                renderPolygonShape(geometry.coordinates[0], color, fill);
            } else if (geometry.type === 'MultiPolygon') {
                geometry.coordinates.forEach(polygon => {
                    renderPolygonShape(polygon[0], color, fill);
                });
            }
        }
        
        function renderPolygon(geometry, color, fill) {
            if (geometry.type === 'Polygon') {
                renderPolygonShape(geometry.coordinates[0], color, fill);
            }
        }
        
        function renderPolygonShape(ring, color, fill) {
            if (ring.length === 0) return;
            
            ctx.beginPath();
            const [x0, y0] = worldToScreen(ring[0][0], ring[0][1]);
            ctx.moveTo(x0, y0);
            
            for (let i = 1; i < ring.length; i++) {
                const [x, y] = worldToScreen(ring[i][0], ring[i][1]);
                ctx.lineTo(x, y);
            }
            ctx.closePath();
            
            if (fill) {
                ctx.fillStyle = color + '20';
                ctx.fill();
            }
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            canvas.style.cursor = 'grabbing';
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const [worldX, worldY] = screenToWorld(mouseX, mouseY);
            
            document.getElementById('positionInfo').textContent = `${worldX.toFixed(0)}, ${worldY.toFixed(0)}`;
            
            if (isDragging) {
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                offsetX += dx;
                offsetY += dy;
                lastX = e.clientX;
                lastY = e.clientY;
                render();
            } else {
                showTooltip(e, worldX, worldY);
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
            tooltip.style.display = 'none';
        });
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const worldX = (mouseX - offsetX) / scale;
            const worldY = (mouseY - offsetY) / scale;
            
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            scale *= zoomFactor;
            
            offsetX = mouseX - worldX * scale;
            offsetY = mouseY - worldY * scale;
            
            document.getElementById('zoomLevel').textContent = scale.toFixed(2) + 'x';
            render();
        });
        
        function showTooltip(e, worldX, worldY) {
            if (!municipalities.length) return;
            
            const hovered = municipalities.find(m => {
                return isPointInFeature(worldX, worldY, m);
            });
            
            if (hovered) {
                const props = hovered.properties;
                tooltip.innerHTML = `
                    <div class="tooltip-title">Municipality ${props.mid}</div>
                    <div class="tooltip-row">Settlements: <span class="tooltip-value">${props.num_settlements}</span></div>
                    <div class="tooltip-row">Area: <span class="tooltip-value">${props.total_area_pixels.toFixed(0)} px²</span></div>
                    <div class="tooltip-row">Type: <span class="tooltip-value">${props.geometry_type}</span></div>
                `;
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
                
                document.getElementById('hoverInfo').textContent = `Municipality ${props.mid}`;
            } else {
                tooltip.style.display = 'none';
                document.getElementById('hoverInfo').textContent = '-';
            }
        }
        
        function isPointInFeature(x, y, feature) {
            const bounds = getBoundingBox(feature);
            return x >= bounds.minX && x <= bounds.maxX && y >= bounds.minY && y <= bounds.maxY;
        }
    </script>
</body>
</html>
